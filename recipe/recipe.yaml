schema_version: 1

context:
  name: tidb-vector
  version: 0.0.15

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tidb_vector-${{ version }}.tar.gz
  sha256: dfd16b31b06f025737f5c7432a08e04265dde8a7c9c67d037e6e694c8125f6f5

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - numpy >=1,<3
  run_constraints:
    - SQLAlchemy >=1.4,<3

tests:
  - python:
      imports:
        - tidb_vector
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A Python client for TiDB Vector
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/pingcap/tidb-vector-python

extra:
  recipe-maintainers:
    - jan-janssen
